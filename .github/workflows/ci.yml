name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        # Pinned by SHA per supply-chain hardening; comment = resolved version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: scripts/setup.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypandoc beautifulsoup4

      # Unit tests mock every external tool (calibre/pandoc) — no system deps needed here
      - name: Run tests
        run: python -m unittest discover tests/ -v

  integration:
    # Real-pipeline smoke gate on the sleepy-hollow baseline:
    # Calibre HTMLZ conversion -> chunking -> manifest -> merge -> HTML -> TOC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/setup.py

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libegl1 libopengl0 libxcb-cursor0 libxkbcommon0
          sudo wget -qO- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin
          echo "=== Versions ==="
          ebook-convert --version
          pandoc --version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypandoc beautifulsoup4

      - name: Run integration smoke gate
        run: python tests/integration_smoke.py

      - name: Full setup.py verification
        run: python scripts/setup.py
