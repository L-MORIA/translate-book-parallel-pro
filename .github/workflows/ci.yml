name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # NOTE: runners are pinned to 24.04 — ubuntu-latest migrated to Ubuntu 26.04
  # on 2026-10-19 and actions/setup-python v5 (pinned below) has no Python
  # 3.9–3.13 builds for it ("The version '3.9' ... was not found for Ubuntu
  # 26.04", CI run 40849120702).  Revisit when the runner image and setup-python
  # major are aligned again.

  lint:
    # Correctness-only ruff gate (rules selected in ruff.toml): Python syntax
    # errors and undefined names. Style rules are deliberately out of scope —
    # the codebase carries style remarks by design (audit T-02).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Pinned so the gate behaves identically across runs; bump the pin
      # together with ruff.toml when a new ruff release is verified locally.
      - name: Install ruff (pinned)
        run: python -m pip install ruff==0.16.4

      # Same invocation as the local gate; configuration lives in ruff.toml
      - name: Lint (fatal checks only)
        run: python -m ruff check .

  test:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        # Pinned by SHA per supply-chain hardening; comment = resolved version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Exact pins: requirements.txt (installed-but-unpinned versions drift)
          pip install -r requirements.txt

      # Unit tests mock every external tool (calibre/pandoc) — no system deps needed here
      - name: Run tests
        run: python -m unittest discover tests/ -v

  integration:
    # Real-pipeline smoke gate on the sleepy-hollow baseline:
    # Calibre HTMLZ conversion -> chunking -> manifest -> merge -> HTML -> TOC
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libegl1 libopengl0 libxcb-cursor0 libxkbcommon0
          sudo wget -qO- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin
          echo "=== Versions ==="
          ebook-convert --version
          pandoc --version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration smoke gate
        run: python tests/integration_smoke.py

      - name: Full setup.py verification
        run: python scripts/setup.py
